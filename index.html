<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Hole Snow Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header with Time -->
        <header>
            <h1>Jackson Hole Snow Tracker</h1>
            <div class="current-time" id="currentTime"></div>
        </header>

        <!-- Main Content Grid -->
        <div class="main-grid">
            <!-- Left Panel: Jackson Hole Conditions -->
            <div class="conditions-panel">
                <h2>Current Conditions</h2>
                <div class="conditions-display">
                    <div class="condition-item">
                        <span class="label">Temperature:</span>
                        <span class="value" id="temperature">--°F</span>
                    </div>
                    <div class="condition-item">
                        <span class="label">24hr Snowfall:</span>
                        <span class="value" id="snowfall24">--"</span>
                    </div>
                    <div class="condition-item">
                        <span class="label">Base Depth:</span>
                        <span class="value" id="baseDepth">--"</span>
                    </div>
                    <div class="condition-item">
                        <span class="label">Conditions:</span>
                        <span class="value" id="conditions">Loading...</span>
                    </div>
                </div>

                <!-- Dynamic Snow Visuals -->
                <div class="snow-visual" id="snowVisual">
                    <canvas id="snowCanvas"></canvas>
                </div>

                <!-- 4-Week Snow History -->
                <div class="history-section">
                    <h3>4-Week Snow History</h3>
                    <canvas id="historyChart"></canvas>
                </div>
            </div>

            <!-- Right Panel: Leaderboard -->
            <div class="leaderboard-panel">
                <h2>Top 10 Resorts - 7 Day Snowfall</h2>
                <div class="leaderboard" id="leaderboard">
                    <!-- Leaderboard items will be generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
